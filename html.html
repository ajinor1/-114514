<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass Demo</title>
    <style>
        /* ----- ベース ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            font-family: -apple-system, 'Segoe UI', sans-serif;
        }

        /* ----- グラデーション背景（Liquid Glassが映えるように） ----- */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #533483 100%);
            z-index: 0;
        }

        /* ----- 装飾用の浮かぶ円（ガラスの反射に映える） ----- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }
        .orb-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 5%;
            background: #f093fb;
        }
        .orb-2 {
            width: 400px;
            height: 400px;
            bottom: 5%;
            right: 5%;
            background: #4facfe;
        }
        .orb-3 {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #43e97b;
            opacity: 0.15;
        }

        /* ============================================================
           ★ Liquid Glass カード（本丸） ★
           ============================================================ */
        .glass-card {
            position: relative;
            z-index: 1;
            width: 360px;
            padding: 40px 32px;
            border-radius: 24px;

            /* ★ ガラスのベース ★ */
            background: rgba(255, 255, 255, 0.08);

            /* ★ バックドロップフィルター（ぼかし） ★ */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            /* ★ ガラスの縁取り（光の反射） ★ */
            border: 1px solid rgba(255, 255, 255, 0.15);

            /* ★ 影 ★ */
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);

            /* ★ 内側の光（グラデーション） ★ */
            background-image:
                radial-gradient(
                    ellipse at 30% 20%,
                    rgba(255, 255, 255, 0.15) 0%,
                    transparent 60%
                );
        }

        /* ----- ガラスの「光沢」効果（左上からの反射） ----- */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.2) 0%,
                transparent 40%,
                transparent 60%,
                rgba(255, 255, 255, 0.05) 100%
            );
            pointer-events: none;
        }

        /* ----- ガラスの「縁の光」効果 ----- */
        .glass-card::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.3) 0%,
                transparent 40%,
                transparent 60%,
                rgba(255, 255, 255, 0.1) 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ----- 中身のテキスト ----- */
        .glass-card h2 {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }

        .glass-card p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        /* ----- アクセント（ボタン風） ----- */
        .glass-card .accent {
            margin-top: 16px;
            padding: 10px 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            display: inline-block;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }
        .glass-card .accent:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }

        /* ----- 白いガラス（バリエーション） ----- */
        .glass-card-white {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glass-card-white h2 {
            color: #fff;
        }
        .glass-card-white p {
            color: rgba(255, 255, 255, 0.8);
        }

        /* ----- 薄いダークガラス（バリエーション） ----- */
        .glass-card-dark {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card-dark h2 {
            color: #fff;
        }
        .glass-card-dark p {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ----- 配置（横並び） ----- */
        .demo-container {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .demo-container .label {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* ----- レスポンシブ ----- */
        @media (max-width: 700px) {
            .demo-container {
                flex-direction: column;
                gap: 24px;
            }
            .glass-card {
                width: 280px;
                padding: 28px 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景 -->
    <div class="bg-gradient"></div>

    <!-- 浮かぶ円 -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- デモカード -->
    <div class="demo-container">
        <!-- 標準ガラス -->
        <div class="glass-card">
            <h2>Liquid Glass</h2>
            <p>バックドロップフィルターで実現する、iOSスタイルのガラスエフェクト。</p>
            <div class="accent">✨ 光る</div>
        </div>

        <!-- 白いガラス -->
        <div class="glass-card glass-card-white">
            <h2>White Glass</h2>
            <p>より明るいガラス表現。白に近い光沢があります。</p>
            <div class="accent">☁️ フロスト</div>
        </div>

        <!-- ダークガラス -->
        <div class="glass-card glass-card-dark">
            <h2>Dark Glass</h2>
            <p>深みのあるダークガラス。落ち着いた雰囲気に。</p>
            <div class="accent">🌙 シャドウ</div>
        </div>
    </div>
</body>
</html>
