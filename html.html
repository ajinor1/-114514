<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>DO NOT CLICK</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #050505;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 警告画面 */
    #warning-screen {
      text-align: center;
      z-index: 10;
    }
    .glitch-btn {
      padding: 20px 40px;
      font-size: 1.5rem;
      color: #ff0055;
      background: transparent;
      border: 2px solid #ff0055;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 3px;
      transition: 0.2s;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }
    .glitch-btn:hover {
      background: #ff0055;
      color: #000;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.8);
    }

    /* メインコンテンツ（最初は隠す） */
    #matrix-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    /* フラッシュ効果 */
    #flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 99;
    }

    /* 飛び出すテキスト */
    .burst-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 5rem;
      font-weight: 900;
      color: #00ffcc;
      text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
      white-space: nowrap;
      pointer-events: none;
      z-index: 20;
    }

    /* アニメーションクラス */
    .trigger-flash {
      animation: flash-anim 0.8s ease-out;
    }
    .trigger-burst {
      animation: burst-anim 2.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    @keyframes flash-anim {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes burst-anim {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.3) rotate(5deg); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(3) rotate(10deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="warning-screen">
    <button class="glitch-btn" onclick="startSurprise()">絶対に押すな ⚠️</button>
  </div>

  <div id="matrix-screen">
    <canvas id="canvas"></canvas>
    <div id="burst" class="burst-text">HTML ONLY REALITY! ⚡️</div>
  </div>

  <div id="flash"></div>

  <script>
    function startSurprise() {
      // 画面切り替え
      document.getElementById('warning-screen').style.display = 'none';
      document.getElementById('matrix-screen').style.display = 'block';

      // エフェクト発動
      const flash = document.getElementById('flash');
      const burst = document.getElementById('burst');
      flash.classList.add('trigger-flash');
      burst.classList.add('trigger-burst');

      // マトリックスレインの始動
      initMatrix();
    }

    function initMatrix() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const alphabet = katakana.split('');

      const fontSize = 16;
      const columns = canvas.width / fontSize;
      const rainDrops = Array.from({ length: columns }).fill(1);

      function draw() {
        ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#0F0';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < rainDrops.length; i++) {
          const text = alphabet[Math.floor(Math.random() * alphabet.length)];
          ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

          if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            rainDrops[i] = 0;
          }
          rainDrops[i]++;
        }
      }

      setInterval(draw, 30);
    }
  </script>
</body>
</html>
