<!DOCTYPE html>
<html>
<head>
  <style>body { margin:0; overflow:hidden; background:#1a1a2e; }</style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
    camera.position.z = 1;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // --- 背景用のテクスチャ（被写体） ---
    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = 1024;
    bgCanvas.height = 1024;
    const ctx = bgCanvas.getContext('2d');
    // カラフルな市松＋グラデーション（屈折が見えるように）
    const grd = ctx.createRadialGradient(512, 512, 50, 512, 512, 500);
    grd.addColorStop(0, '#ff6b6b');
    grd.addColorStop(0.3, '#feca57');
    grd.addColorStop(0.6, '#48dbfb');
    grd.addColorStop(1, '#1dd1a1');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, 1024, 1024);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i=0; i<20; i++) {
      ctx.beginPath();
      ctx.arc(100+i*45, 200+i*30, 60, 0, Math.PI*2);
      ctx.fill();
    }
    const bgTexture = new THREE.CanvasTexture(bgCanvas);

    // --- シェーダーマテリアル ---
    const material = new THREE.ShaderMaterial({
      uniforms: {
        uBg: { value: bgTexture },
        uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uTime: { value: 0 }
      },
      vertexShader: `
        void main() {
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform vec2 uRes;
        uniform sampler2D uBg;
        uniform float uTime;

        // ---- 角丸矩形SDF ----
        float sdRoundedBox(vec2 p, vec2 b, float r) {
          vec2 q = abs(p) - b + r;
          return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
        }

        // ---- ガラス断面高さ関数 ----
        float glassHeight(float x) {
          return 1.0 - sqrt(1.0 - (1.0 - x) * (1.0 - x));
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / uRes;
          vec2 aspect = vec2(uRes.x / uRes.y, 1.0);
          vec2 p = (uv - 0.5) * 2.0 * aspect;

          // 角丸矩形パラメータ（ベゼル幅 0.3、角丸半径 0.2）
          float bezel = 0.3;
          float radius = 0.2;
          float d = sdRoundedBox(p, vec2(0.9, 0.9), radius);
          float dist = -d; // 輪郭からの距離（外側は負）

          // 輪郭からベゼル内端までの正規化距離 x (0=輪郭, 1=内端)
          float x = clamp(dist / bezel, 0.0, 1.0);

          // ガラス厚み h
          float h = glassHeight(x);

          // SDFの勾配（数値微分）
          float eps = 0.001;
          vec2 grad = vec2(
            sdRoundedBox(p + vec2(eps, 0.0), vec2(0.9,0.9), radius) - d,
            sdRoundedBox(p + vec2(0.0, eps), vec2(0.9,0.9), radius) - d
          ) / eps;
          grad = normalize(grad);

          // 変位量（屈折オフセット）
          float dh = 2.0 * (1.0 - x); // dh/dx
          float displace = h * dh * 0.15; // 厚み×歪み

          // 色収差（RGB別オフセット）
          float offsetR = displace * 1.2;
          float offsetG = displace * 1.0;
          float offsetB = displace * 0.8;

          vec2 uvBg = uv - grad.xy * vec2(offsetR, offsetR) * 0.1;
          vec2 uvBgG = uv - grad.xy * vec2(offsetG, offsetG) * 0.1;
          vec2 uvBgB = uv - grad.xy * vec2(offsetB, offsetB) * 0.1;

          // 背景サンプリング（色収差）
          float r = texture2D(uBg, uvBg).r;
          float g = texture2D(uBg, uvBgG).g;
          float b = texture2D(uBg, uvBgB).b;
          vec3 bgCol = vec3(r, g, b);

          // ベール・ランベルト吸収（ガラス色：淡いシアン）
          vec3 absorb = vec3(0.2, 0.05, 0.1); // 吸収係数（RGB別）
          float pathLen = h * 2.0;
          vec3 glassCol = exp(-absorb * pathLen);

          // Schlickフレネル（輪郭で反射強度アップ）
          vec3 viewDir = vec3(0.0, 0.0, 1.0);
          float fresnel = pow(1.0 - max(dot(viewDir, vec3(grad, 0.0)), 0.0), 3.0);
          float spec = fresnel * 0.8 + 0.2;

          // すりガラス（内側だけぼかす）
          float frosted = smoothstep(0.3, 0.9, x);
          vec2 uvFrost = uv + (texture2D(uBg, uv * 3.0 + uTime * 0.01).rg - 0.5) * 0.03 * frosted;
          vec3 frostCol = texture2D(uBg, uvFrost).rgb;

          // 最終合成
          vec3 finalCol = mix(bgCol, frostCol, frosted * 0.6);
          finalCol *= glassCol; // 吸収
          finalCol += vec3(spec) * 0.3; // フレネルハイライト

          // 輪郭外は完全透明（ガラス部分だけ表示）
          float alpha = smoothstep(0.0, 0.02, dist);

          gl_FragColor = vec4(finalCol, alpha);
        }
      `,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    const geometry = new THREE.PlaneGeometry(2, 2);
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // リサイズ対応
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      material.uniforms.uRes.value.set(w, h);
    });

    // アニメーション
    function animate() {
      material.uniforms.uTime.value += 0.01;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

  </script>
</body>
</html>
