<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    background: #1a1a2e; /* 背景色 */
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  /* 画面全体 */
  .container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* ベゼル（枠） */
  .bezel {
    position: absolute;
    inset: 0;
    border-radius: 30px; /* 角丸 */
    border: 2px solid rgba(255,255,255,0.1); /* 輪郭線 */
    background: rgba(255, 255, 255, 0.05); /* 薄いガラス色 */
    box-shadow: 
      inset 0 0 20px rgba(255,255,255,0.2), /* 内側のハイライト */
      inset 0 0 5px rgba(255,255,255,0.5),  /* 縁の反射 */
      0 0 20px rgba(0,0,0,0.5);             /* 外側の影 */
    backdrop-filter: blur(8px); /* すりガラス効果 */
  }

  /* テキストとアイコンの配置 */
  .ui {
    position: absolute;
    top: 20px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    box-sizing: border-box;
    z-index: 10;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    color: white;
  }

  .title {
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* 共有ボタン（右下） */
  .share-btn {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 24px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="bezel"></div>

    <div class="ui">
      <div class="icon-btn">☰</div>
      <div class="title">うんこ <span style="font-size: 12px;">▼</span></div>
      <div class="icon-btn">✕</div>
    </div>

    <div class="share-btn">⬆︎</div>
  </div>
</body>
</html>
